name: Render Baykod Social Image

on:
  push:
    paths:
      - "source/*.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render 1080x1350 JPEG
        run: |
          mkdir -p posts
          rsvg-convert -w 1080 -h 1350 source/baykod-tanitim.svg -o /tmp/baykod.png
          convert /tmp/baykod.png -quality 94 posts/baykod-tanitim-hq.jpg

      - name: Commit rendered image
        run: |
          git config user.name "Baykod Social Bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/baykod-tanitim-hq.jpg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Render high-quality Baykod social post"
          git push
