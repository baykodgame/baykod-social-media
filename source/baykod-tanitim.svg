<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#009fc9"/>
      <stop offset="0.52" stop-color="#0b4fa8"/>
      <stop offset="1" stop-color="#d20b86"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#075cc8"/>
      <stop offset="0.55" stop-color="#173c92"/>
      <stop offset="1" stop-color="#bf0a86"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
